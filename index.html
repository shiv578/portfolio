
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shivam Swaraj | Full-Stack Architect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#00f2ff',   // Neon Cyan
              secondary: '#9d00ff', // Electric Purple
              'dark-bg': '#05050a',
              'darker-bg': '#020205',
            },
            fontFamily: {
              heading: ['Orbitron', 'Rajdhani', 'sans-serif'],
              body: ['Inter', 'Poppins', 'sans-serif'],
              code: ['Fira Code', 'JetBrains Mono', 'monospace'],
            },
            transitionTimingFunction: {
              'premium': 'cubic-bezier(0.4, 0, 0.2, 1)',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse-slow 4s ease-in-out infinite',
              'spin-slow': 'spin 20s linear infinite',
            },
            keyframes: {
              'float': {
                '0%, 100%': { transform: 'translate3d(0, 0, 0)' },
                '50%': { transform: 'translate3d(0, -20px, 0)' },
              },
              'pulse-slow': {
                '0%, 100%': { opacity: 0.6, transform: 'scale(1)' },
                '50%': { opacity: 1, transform: 'scale(1.05)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #05050a;
        color: white;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 242, 255, 0.1);
      }
      .neon-border {
        box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        border: 1px solid rgba(0, 242, 255, 0.5);
      }
      .neon-text-glow {
        text-shadow: 0 0 10px rgba(0, 242, 255, 0.5), 0 0 20px rgba(157, 0, 255, 0.3);
      }
      .btn-cyber {
        position: relative;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(0, 242, 255, 0.2);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }
      .btn-cyber::before {
        content: '';
        position: absolute;
        top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.1), transparent);
        transition: 0.5s;
      }
      .btn-cyber:hover::before { left: 100%; }
      .btn-cyber:hover {
        border-color: #00f2ff;
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        transform: translate3d(0, -2px, 0);
        background: rgba(0, 242, 255, 0.05);
      }
      .hero-gradient-text {
        background: linear-gradient(to bottom, #00f2ff, #9d00ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gpu-accelerated {
        transform: translate3d(0,0,0);
        will-change: transform, opacity;
      }
      .cyber-grid {
        background-image: 
          linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
